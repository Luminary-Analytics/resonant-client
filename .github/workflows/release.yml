name: Release

# Triggered by pushing a tag like v0.2.0 / v0.2.1 / v1.0.0.
# Tag-only — never on plain commits to main, never on branches.
#
# What this workflow does end-to-end:
#   1. Job `test`: lint and tests. They install packages from PyPI within
#      pyproject.toml's ranges, so nothing this job makes is used; `release`
#      only waits for it to pass.
#   2. Job `build`, from pinned inputs only: checks that the tag's commit is
#      on main and matches __version__, then builds the PyInstaller bundle in
#      a fresh Python with nothing but hash-pinned packages
#      (packaging/requirements-release.txt, --require-hashes, no pip cache),
#      with third-party notices and a CycloneDX SBOM, handed to `release` as an
#      artifact. No secret, no OIDC token, no environment.
#   3. Job `release`, after both: checks the tag again and takes only the
#      bundle, SBOM and notices from the artifact. Authenticode-signs lumi.exe,
#      wraps the bundle into an Inno Setup installer (lumi-setup-X.Y.Z.exe)
#      and, for stable tags, an MSI for device management (lumi-X.Y.Z.msi, WiX
#      pinned by SHA-256), and Authenticode-signs both when a signer is
#      configured (.github/actions/authenticode-sign, then
#      packaging/sign_windows.ps1): Azure Artifact Signing with a short-lived
#      OIDC sign-in, or a PFX or command
#   4. Signs the installer with the EdDSA private key (from EDDSA_PRIVATE_KEY secret)
#   5. Checks what it signed, unchanged and signed as recorded
#      (packaging/check_release_files.ps1), and creates a GitHub Release with
#      those files, the SBOM and the notices
#   6. Copies the installer to the GitHub Pages site (downloads/vX.Y.Z/),
#      prunes old installers and adds the release to the update feeds: a
#      stable tag to appcast.xml, the beta feed and its release line's feed;
#      a beta tag (vX.Y.Z-beta.N) to the beta feed only
#   7. Publishes gh-pages as one fresh commit. WinSparkle in installed copies
#      picks up the release within 24h (or on next launch if the check is stale)
#
# macOS, alongside (jobs `macos` and `publish-macos`):
#   8. Builds Lumi.app with Sparkle, the DMG and the PKG (packaging/build_macos.sh)
#      on Apple silicon, from pinned inputs as on Windows. With the Apple
#      secrets (docs/macos.md) they are signed with the Developer ID,
#      notarized and stapled; without them the app is signed ad hoc, and the
#      run, the release and the download page say it isn't notarized.
#   9. Once the Windows job has published, signs the DMG with the same EdDSA
#      key, adds the DMG and PKG to the GitHub Release, copies the DMG to the
#      Pages site beside the installer and adds it to the macOS feeds
#      (appcast-macos*.xml; the Windows feeds are left as they are). Sparkle in
#      installed Macs picks it up within 24h.
#   A failed macOS build doesn't hold the Windows release back; rerun its jobs.
#
# Hardening (docs/release-pipeline.md#the-release-environment):
#   - Only commits on main are released: `build`, `release` and `macos` stop
#     unless the tag's commit is on main, and a tag ruleset lets only the
#     owner create v* tags.
#   - Jobs that use the EdDSA key or the Apple or Windows signing secrets run
#     in the `release` environment, which the owner restricts to v* tags.
#   - Only the `release` job may ask for an OIDC token (id-token: write), for
#     the Azure sign-in Artifact Signing uses; the Azure identity trusts only
#     this environment's subject. It runs this repository's code, actions
#     pinned by commit and tools pinned by SHA-256, and installs nothing else.
#     The tests, and every package they install from PyPI, run in `test`; the
#     bytes it signs come from `build`. tests/test_release_supply_chain.py
#     fails on another job with a token, or a run-time install that isn't
#     hash-checked.
#   - `release` and `publish-macos` take artifacts by the ID the job that made
#     them recorded, never by name, and check the files against the digest
#     that job took of them before uploading (packaging/tree_digest.py). Both
#     come as job outputs, which no other job can change: an artifact `test`
#     deleted or replaced stops the release instead of being signed.
#   - Only the two publishing jobs get contents: write; the macOS build reads.
#     Checkouts that never push keep no credentials.
#   - The jobs that write gh-pages share one concurrency group and push with a
#     lease on the commit they checked out, so two runs can't overwrite each
#     other (packaging/push_pages.py).
#   - Git keeps the site's bytes as written (core.autocrlf off, and the site's
#     .gitattributes), and push_pages.py commits only after the staged blobs,
#     what Pages serves, verify: the signed macOS feeds and their disk images.
#   - The EdDSA key file is deleted as soon as it has signed, before any
#     third-party action runs. Actions are pinned by commit.
#   - With the repository variables MACOS_SIGNING_REQUIRED or
#     WINDOWS_SIGNING_REQUIRED set to true, missing signing secrets fail the
#     release instead of shipping an unsigned build.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  test:
    # Correctness gate. A signed installer that auto-updates every deployed
    # copy of Lumi is the last artifact that should ever be cut from a red
    # tree, and a tag push can race ahead of the PR that `tests.yml` gated.
    # The test run installs packages from PyPI, so nothing it makes is used:
    # no artifact, no secret, no OIDC token, no environment.
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install for tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

  build:
    # The bundle `release` signs, from pinned inputs only: this repository at
    # the tagged commit, a fresh Python from setup-python without a pip cache,
    # and packages installed only with --require-hashes (the SBOM tools here;
    # packaging/requirements-release.txt in scripts/build_clean.ps1, which
    # also fetches ripgrep and the web assets by SHA-256). No tests, no
    # secret, no OIDC token, no environment.
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # What `release` takes from here: the artifact's ID, and the digest of its
    # files. Job outputs are the one thing no other job in the run can change.
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.handover.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0      # every branch's history: main's, for the check below
          filter: blob:none   # without file contents, but the tagged commit's
          persist-credentials: false

      # Only a commit on main is released: a tag on any other commit (a
      # branch nobody merged) stops here, before anything is built or signed.
      - name: Check the tag is on main
        shell: bash
        run: |
          set -euo pipefail
          tagged="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if [ "$tagged" != "$(git rev-parse HEAD)" ]; then
            echo "::error::The checkout isn't the commit ${GITHUB_REF_NAME} tags ($tagged)."
            exit 1
          fi
          git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null || { echo "::error::main wasn't fetched."; exit 1; }
          if ! git merge-base --is-ancestor "$tagged" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} tags $tagged, which isn't on main. Only commits on main are released."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} tags $tagged, which is on main."

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          # GITHUB_REF is refs/tags/v0.2.0 — strip the prefix.
          VERSION="${GITHUB_REF#refs/tags/v}"
          # A release is X.Y.Z, or X.Y.Z-alpha.N, -beta.N or -rc.N; its hyphen marks a
          # pre-release here, on GitHub, in the update feeds and in the installers.
          # A PEP 440 spelling such as 0.20.0rc1 has none and would publish as the
          # latest stable release, so it stops here (packaging/legal_texts.py
          # release-check refuses it too).
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::$VERSION isn't a release version: tag vX.Y.Z, or vX.Y.Z-alpha.N, vX.Y.Z-beta.N or vX.Y.Z-rc.N"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release $VERSION (pre-release: $PRERELEASE)"

      - name: Sanity check — tag matches __version__
        shell: bash
        run: |
          PKG_VERSION=$(python -c "import re,pathlib;m=re.search(r'__version__\\s*=\\s*\"([^\"]+)\"',pathlib.Path('lumi/__init__.py').read_text());print(m.group(1))")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.version }}) does not match lumi/__init__.py __version__ ($PKG_VERSION)"
            exit 1
          fi
          echo "Version match: $PKG_VERSION"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      # Lumi's terms ship with every installer and ask for acceptance in the
      # app: a release fails while lumi/legal/terms.json still holds a fact
      # [[TO BE PROVIDED: ...]], while a text isn't what
      # packaging/legal_texts.py renders, or for a version below 0.20.0 (the
      # releases through v0.19.1 were published under the MIT License, and
      # v0.2.0 through v0.6.2 under none). RELEASING.md. Here, in the job
      # that builds what's released, before anything is built; `release`
      # needs this job, so nothing is signed either (standard library only).
      - name: Legal texts are complete
        run: python packaging/legal_texts.py release-check --release --version "${{ steps.version.outputs.version }}"

      - name: Install the pinned SBOM tools
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r packaging/tools-requirements.txt

      - name: Build PyInstaller bundle
        shell: pwsh
        run: |
          ./scripts/build_clean.ps1 -SbomPath "dist/lumi-${{ steps.version.outputs.version }}-sbom.cdx.json"
          if (-not (Test-Path "dist/lumi/lumi.exe")) {
              throw "PyInstaller did not produce dist/lumi/lumi.exe"
          }
          Copy-Item "dist/lumi/_internal/licenses/THIRD_PARTY_NOTICES.txt" `
              "dist/lumi-${{ steps.version.outputs.version }}-THIRD_PARTY_NOTICES.txt"

      - name: Smoke-test bundled exe
        shell: pwsh
        run: |
          # Just confirm --version works — quick sanity that the bundle is
          # not totally broken before we spend time wrapping it.
          $stdout = Join-Path $env:RUNNER_TEMP "lumi-version.out"
          $stderr = Join-Path $env:RUNNER_TEMP "lumi-version.err"
          $proc = Start-Process -FilePath "dist/lumi/lumi.exe" `
              -ArgumentList "--version" -Wait -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($proc.ExitCode -ne 0) {
              throw "Bundled exe --version exited $($proc.ExitCode): $(Get-Content $stderr -Raw)"
          }
          $output = (Get-Content $stdout -Raw).Trim()
          if ($output -notmatch "lumi ${{ steps.version.outputs.version }}") {
              throw "Bundled exe reported wrong version: $output"
          }
          Write-Host "Smoke test passed: $output"

      # Of exactly what's uploaded next, for `release` to check what it
      # downloads against (packaging/tree_digest.py). dist/legal is the
      # installers' license page build_clean.ps1 rendered, which
      # packaging/installer.iss includes.
      - name: Digest of the files for the release job
        id: handover
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $digest = python packaging/tree_digest.py dist lumi legal "lumi-$v-sbom.cdx.json" "lumi-$v-THIRD_PARTY_NOTICES.txt"
          if ($LASTEXITCODE -ne 0) { throw "tree_digest.py failed" }
          "digest=$digest" >> $env:GITHUB_OUTPUT
          Write-Host "Handing over files with digest $digest"

      - name: Keep the bundle for the release job
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lumi-windows-bundle
          path: |
            dist/lumi/
            dist/legal/
            dist/lumi-${{ steps.version.outputs.version }}-sbom.cdx.json
            dist/lumi-${{ steps.version.outputs.version }}-THIRD_PARTY_NOTICES.txt
          include-hidden-files: true   # all the digest covers
          if-no-files-found: error
          retention-days: 7

  release:
    # Signs, packages and publishes what `build` made, once `test` passed too.
    # This job holds the EdDSA key and the Azure signing identity, so it runs
    # only this repository's code at the tagged commit, actions pinned by
    # commit and tools pinned by SHA-256, and installs nothing else.
    needs: [test, build]
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write   # creates the Release and pushes gh-pages
      id-token: write   # the Azure sign-in for Authenticode (OIDC); no other job may have it
    concurrency:
      group: release-gh-pages
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0      # every branch's history: main's, for the check below
          filter: blob:none   # without file contents, but the tagged commit's
          persist-credentials: false

      # As in `build`, and before anything is signed.
      - name: Check the tag is on main
        shell: bash
        run: |
          set -euo pipefail
          tagged="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if [ "$tagged" != "$(git rev-parse HEAD)" ]; then
            echo "::error::The checkout isn't the commit ${GITHUB_REF_NAME} tags ($tagged)."
            exit 1
          fi
          git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null || { echo "::error::main wasn't fetched."; exit 1; }
          if ! git merge-base --is-ancestor "$tagged" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} tags $tagged, which isn't on main. Only commits on main are released."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} tags $tagged, which is on main."

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # As in `build`: X.Y.Z, or X.Y.Z-alpha.N, -beta.N or -rc.N, whose hyphen marks a
          # pre-release: no MSI, and a pre-release on GitHub.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::$VERSION isn't a release version: tag vX.Y.Z, or vX.Y.Z-alpha.N, vX.Y.Z-beta.N or vX.Y.Z-rc.N"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (pre-release: $PRERELEASE)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      # By the ID `build` recorded, never by name: any job in this run, `test`
      # too, could delete an artifact and upload another under the same name.
      # The ID is never empty ('none' fails), since no ID and no name would
      # download every artifact in the run. merge-multiple keeps the files in
      # dist rather than dist/<artifact name>.
      - name: Fetch the bundle build made
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id || 'none' }}
          path: dist
          merge-multiple: true

      # download-artifact only warns when a download doesn't match the
      # artifact's digest. This fails, on the files themselves, before
      # anything reads them.
      - name: Check the bundle is byte for byte what build made
        shell: pwsh
        env:
          HANDOVER_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          python packaging/tree_digest.py dist --expect "$env:HANDOVER_DIGEST"
          if ($LASTEXITCODE -ne 0) { throw "The bundle isn't what the build job made; nothing was signed" }

      # The bundle, its license page, SBOM and notices come from `build`, and
      # nothing else does: the installers are made and signed here.
      - name: Take only the bundle, SBOM and notices from the build
        shell: pwsh
        run: ./packaging/check_release_files.ps1 -Version "${{ steps.version.outputs.version }}" -Handover

      # Authenticode is Windows' publisher signature (SmartScreen, company
      # policies); EdDSA below is the update feed's. The action decides from
      # the release environment's variables and secrets: Azure Artifact
      # Signing, a PFX or a command, or unsigned with a warning until one is
      # configured (docs/release-pipeline.md). Each signing signs in to Azure
      # afresh, so a sign-in never outlives GitHub's short-lived token, and
      # records the file and its SHA-256 for the check before publishing.
      - name: Authenticode-sign lumi.exe
        uses: ./.github/actions/authenticode-sign
        with:
          files: dist/lumi/lumi.exe
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          artifact-signing-endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          artifact-signing-account: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          artifact-signing-profile: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          pfx-base64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          command: ${{ vars.WINDOWS_SIGN_COMMAND }}
          expected-subject: ${{ vars.WINDOWS_SIGN_EXPECTED_SUBJECT }}
          required: ${{ vars.WINDOWS_SIGNING_REQUIRED }}

      # NOTE: windows-latest GitHub-hosted runners ship Inno Setup pre-installed
      # (v6.7+ as of late 2025). No need to install — the "Build installer" step
      # below has a recursive fallback in case the path moves between runner
      # images.

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
              # Fallback for newer choco installs.
              $iscc = (Get-ChildItem "C:\" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue -Depth 5 | Select-Object -First 1).FullName
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "packaging/installer.iss"
          $installer = "dist/installer/lumi-setup-${{ steps.version.outputs.version }}.exe"
          if (-not (Test-Path $installer)) {
              throw "Installer not produced at $installer"
          }
          $size = (Get-Item $installer).Length
          Write-Host "Installer: $installer ($([math]::Round($size / 1MB, 1)) MB)"

      # An MSI for Intune, Configuration Manager and Group Policy. MSI versions
      # are three numbers, so pre-releases get none. WiX and the UI extension
      # its license page needs are their NuGet packages, each checked against
      # its pinned SHA-256 and installed from a folder that holds only that
      # file (packaging/fetch_wix.ps1): nothing in this job, which holds the
      # Azure sign-in, is resolved at run time.
      - name: Build the MSI
        if: ${{ steps.version.outputs.prerelease == 'false' }}
        shell: pwsh
        run: |
          $wix = ./packaging/fetch_wix.ps1 -Destination (Join-Path $env:RUNNER_TEMP "wix") | Select-Object -Last 1
          ./packaging/build_msi.ps1 -Version "${{ steps.version.outputs.version }}" -Wix $wix.Wix -UiExtension $wix.UiExtension

      - name: Authenticode-sign the MSI
        if: ${{ steps.version.outputs.prerelease == 'false' }}
        uses: ./.github/actions/authenticode-sign
        with:
          files: dist/installer/lumi-${{ steps.version.outputs.version }}.msi
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          artifact-signing-endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          artifact-signing-account: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          artifact-signing-profile: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          pfx-base64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          command: ${{ vars.WINDOWS_SIGN_COMMAND }}
          expected-subject: ${{ vars.WINDOWS_SIGN_EXPECTED_SUBJECT }}
          required: ${{ vars.WINDOWS_SIGNING_REQUIRED }}

      # Before the EdDSA signature, so the update feed signs the final bytes.
      - name: Authenticode-sign the installer
        uses: ./.github/actions/authenticode-sign
        with:
          files: dist/installer/lumi-setup-${{ steps.version.outputs.version }}.exe
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          artifact-signing-endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          artifact-signing-account: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          artifact-signing-profile: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          pfx-base64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          command: ${{ vars.WINDOWS_SIGN_COMMAND }}
          expected-subject: ${{ vars.WINDOWS_SIGN_EXPECTED_SUBJECT }}
          required: ${{ vars.WINDOWS_SIGNING_REQUIRED }}

      - name: Sign installer with EdDSA
        id: sign
        shell: pwsh
        env:
          EDDSA_PRIVATE_KEY: ${{ secrets.EDDSA_PRIVATE_KEY }}
        run: |
          if (-not $env:EDDSA_PRIVATE_KEY) {
              throw "EDDSA_PRIVATE_KEY repo secret is not set. Generate with `winsparkle-tool generate-key` and add to repo secrets."
          }
          # The private key goes to a file only for as long as signing takes:
          # later steps run third-party actions with write access, so it is
          # deleted here, whatever happens.
          $keyPath = "$env:RUNNER_TEMP\eddsa_priv.key"
          $tool = "packaging/winsparkle/WinSparkle-0.9.2/bin/winsparkle-tool.exe"
          $installer = "dist/installer/lumi-setup-${{ steps.version.outputs.version }}.exe"
          try {
              $env:EDDSA_PRIVATE_KEY | Out-File -Encoding ascii -NoNewline $keyPath
              # winsparkle-tool sign prints just the base64 EdDSA signature to
              # stdout. The installer is the trailing positional arg, NOT --file.
              $signature = & $tool sign --private-key-file $keyPath $installer
              if ($LASTEXITCODE -ne 0) {
                  throw "winsparkle-tool sign failed with exit code $LASTEXITCODE"
              }
          } finally {
              Remove-Item -Force -ErrorAction SilentlyContinue $keyPath
          }
          $signature = "$signature".Trim()
          Write-Host "EdDSA signature: $($signature.Substring(0, [Math]::Min(20, $signature.Length)))..."
          echo "signature=$signature" >> $env:GITHUB_OUTPUT

      # Just before anything is published, and only what this job made: the
      # installer (and, for a stable tag, the MSI), each unchanged since
      # sign_windows.ps1 signed and recorded it, and signed as recorded
      # (Valid, timestamped, by WINDOWS_SIGN_EXPECTED_SUBJECT), plus the
      # build's SBOM and notices. The list it outputs is what's published.
      - name: Check the release files
        id: files
        shell: pwsh
        env:
          WINDOWS_SIGN_RECORD: ${{ runner.temp }}/lumi-authenticode.jsonl
          WINDOWS_SIGN_EXPECTED_SUBJECT: ${{ vars.WINDOWS_SIGN_EXPECTED_SUBJECT }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: ./packaging/check_release_files.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release with installer
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lumi ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: ${{ steps.files.outputs.files }}

      # Installed apps poll the GitHub Pages feeds and download installers
      # anonymously. The source repository may be private, so Release assets
      # are not reachable for them; the Pages site hosts the newest installers
      # too. Pre-release tags reach only the beta feed (appcast-beta.xml), so
      # installs on the stable channel never see them.
      #
      # Git for Windows turns "\n" into "\r\n" as it checks files out, and back
      # as it commits them: that would change the bytes the macOS feeds are
      # signed over. From here on Git leaves them alone (the source checked
      # out above is unaffected), as the site's own .gitattributes also says.
      - name: Keep Git from changing the Pages site's bytes
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout gh-pages branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: gh-pages
          path: gh-pages-checkout

      # Again, just before the Pages site gets them.
      - name: Check the release files again
        id: pages-files
        shell: pwsh
        env:
          WINDOWS_SIGN_RECORD: ${{ runner.temp }}/lumi-authenticode.jsonl
          WINDOWS_SIGN_EXPECTED_SUBJECT: ${{ vars.WINDOWS_SIGN_EXPECTED_SUBJECT }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: ./packaging/check_release_files.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Publish installer and appcast to the Pages site
        shell: pwsh
        run: |
          $owner = "${{ github.repository_owner }}".ToLowerInvariant()
          $repo = "${{ github.event.repository.name }}"
          $pages = "https://$owner.github.io/$repo"
          $installer = "dist/installer/lumi-setup-${{ steps.version.outputs.version }}.exe"
          $extras = @()
          $msi = "${{ steps.pages-files.outputs.msi }}"
          if ($msi) { $extras = @("--extra", $msi) }
          python packaging/publish_pages.py `
              --site "gh-pages-checkout" `
              --installer $installer `
              --version "${{ steps.version.outputs.version }}" @extras
          if ($LASTEXITCODE -ne 0) { throw "publish_pages.py failed" }

          $notes = "<p>Lumi ${{ steps.version.outputs.version }}. See <a href=`"$pages/`">$pages/</a>.</p>"
          python packaging/update_appcast.py `
              --version "${{ steps.version.outputs.version }}" `
              --installer $installer `
              --signature "${{ steps.sign.outputs.signature }}" `
              --notes $notes `
              --site "gh-pages-checkout" `
              --download-base "$pages/downloads"
          if ($LASTEXITCODE -ne 0) { throw "update_appcast.py failed" }

      # Publish gh-pages as one fresh commit so removed installers do not
      # accumulate in branch history; appcast.xml keeps the version history.
      # packaging/push_pages.py stages the site and commits nothing unless the
      # staged blobs, the bytes Pages will serve, check out: the earlier
      # releases' macOS feeds and disk images too, and (--signed) this
      # release's installers, byte for byte as sign_windows.ps1 recorded them.
      # Its lease refuses the push if gh-pages moved since the checkout above;
      # nothing changed (a retry) pushes nothing.
      - name: Push the Pages site
        shell: pwsh
        env:
          WINDOWS_SIGN_RECORD: ${{ runner.temp }}/lumi-authenticode.jsonl
        run: |
          python packaging/push_pages.py gh-pages-checkout `
              --message "release: Lumi ${{ steps.version.outputs.version }} installer and appcast" `
              --tool packaging/winsparkle/WinSparkle-0.9.2/bin/winsparkle-tool.exe `
              --signed $env:WINDOWS_SIGN_RECORD
          if ($LASTEXITCODE -ne 0) { throw "push_pages.py didn't publish the Pages site" }

  macos:
    # Lumi.app in a DMG (Sparkle updates it from the macOS feeds) and a PKG for
    # device management, built on Apple silicon by packaging/build_macos.sh
    # from pinned inputs, as `build` is: no tests, no pip cache, packages only
    # with --require-hashes. It only builds: read access, and the release
    # environment for the Apple secrets.
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      notarized: ${{ steps.status.outputs.notarized }}
      # What `publish-macos` takes, as `release` takes `build`'s bundle.
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.handover.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0      # every branch's history: main's, for the check below
          filter: blob:none   # without file contents, but the tagged commit's
          persist-credentials: false

      # As in `build`: before the Developer ID signs anything.
      - name: Check the tag is on main
        shell: bash
        run: |
          set -euo pipefail
          tagged="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if [ "$tagged" != "$(git rev-parse HEAD)" ]; then
            echo "::error::The checkout isn't the commit ${GITHUB_REF_NAME} tags ($tagged)."
            exit 1
          fi
          git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null || { echo "::error::main wasn't fetched."; exit 1; }
          if ! git merge-base --is-ancestor "$tagged" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} tags $tagged, which isn't on main. Only commits on main are released."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} tags $tagged, which is on main."

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # A release is X.Y.Z, or X.Y.Z-alpha.N, -beta.N or -rc.N; its hyphen marks a
          # pre-release here, on GitHub, in the update feeds and in the installers.
          # A PEP 440 spelling such as 0.20.0rc1 has none and would publish as the
          # latest stable release, so it stops here (packaging/legal_texts.py
          # release-check refuses it too).
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::$VERSION isn't a release version: tag vX.Y.Z, or vX.Y.Z-alpha.N, vX.Y.Z-beta.N or vX.Y.Z-rc.N"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building the macOS release $VERSION (pre-release: $PRERELEASE)"

      - name: Sanity check — tag matches __version__
        shell: bash
        run: |
          PKG_VERSION=$(python3 -c "import re,pathlib;m=re.search(r'__version__\\s*=\\s*\"([^\"]+)\"',pathlib.Path('lumi/__init__.py').read_text());print(m.group(1))")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.version }}) does not match lumi/__init__.py __version__ ($PKG_VERSION)"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      # As in the Windows job: no release while Lumi's terms are incomplete.
      - name: Legal texts are complete
        run: python3 packaging/legal_texts.py release-check --release --version "${{ steps.version.outputs.version }}"

      - name: Install the pinned SBOM tools
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r packaging/tools-requirements.txt

      # Signed with the Developer ID, notarized and stapled when these secrets
      # exist (RELEASING.md, docs/macos.md); otherwise signed ad hoc, unless
      # the MACOS_SIGNING_REQUIRED variable is true, which fails the build.
      - name: Build Lumi.app, the DMG and the PKG
        env:
          MACOS_SIGNING_REQUIRED: ${{ vars.MACOS_SIGNING_REQUIRED }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_SIGN_P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/build_macos.sh --sbom "dist/lumi-${{ steps.version.outputs.version }}-macos-sbom.cdx.json"

      - name: Smoke-test the app
        env:
          LUMI_KEYCHAIN: 'off'
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          app="dist/Lumi.app/Contents/MacOS/lumi"
          "$app" --version | tee version.txt
          grep -qx "lumi ${{ steps.version.outputs.version }}" version.txt
          "$app" --print-pubkey | tee pubkey.txt
          test "EDDSA_PUBLIC_KEY=$(plutil -extract SUPublicEDKey raw dist/Lumi.app/Contents/Info.plist)" = "$(sed -n 1p pubkey.txt)"
          test "$(plutil -extract SURequireSignedFeed raw dist/Lumi.app/Contents/Info.plist)" = "true"
          test -x dist/Lumi.app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate
          "$app" updates | tee updates.json
          python3 -c 'import json; s = json.load(open("updates.json")); assert s["platform"] == "macos" and s["installed_by"] == "", s'

      - name: Record whether the DMG is notarized
        id: status
        run: |
          dmg="dist/installer/lumi-${{ steps.version.outputs.version }}.dmg"
          if xcrun stapler validate "$dmg" >/dev/null 2>&1; then
            echo "notarized=true" >> "$GITHUB_OUTPUT"
            echo "The DMG is signed with the Developer ID, notarized and stapled."
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=macOS build not notarized::Lumi.app is signed ad hoc, not with a Developer ID, and the DMG isn't notarized. macOS won't open it until each tester chooses Open Anyway in System Settings > Privacy & Security. Add the Apple secrets in RELEASING.md to sign and notarize."
          fi

      - name: Gather the release files
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          mkdir -p release
          cp "dist/installer/lumi-$v.dmg" "dist/installer/lumi-$v.pkg" "dist/lumi-$v-macos-sbom.cdx.json" release/
          cp "$(find dist/Lumi.app -name THIRD_PARTY_NOTICES.txt | head -1)" "release/lumi-$v-macos-THIRD_PARTY_NOTICES.txt"
          ls -l release

      - name: Digest of the files for the publishing job
        id: handover
        run: |
          set -euo pipefail
          digest="$(python3 packaging/tree_digest.py release)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Handing over files with digest $digest"

      - name: Keep them for the publishing job
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lumi-macos-release
          path: release/
          include-hidden-files: true   # all the digest covers
          if-no-files-found: error
          retention-days: 7

  publish-macos:
    # After the Windows job, which creates the GitHub Release and pushes
    # gh-pages; this adds to both. On Windows, so winsparkle-tool signs the
    # DMG and the macOS feeds exactly as it signs the installer, with the same
    # key (packaging/publish_macos.ps1, which build-macos.yml rehearses with a
    # throwaway key on every packaging change).
    needs: [release, macos]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write   # adds to the Release and pushes gh-pages
    concurrency:
      group: release-gh-pages
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      # As `release` takes the bundle: by the ID the macOS job recorded, then
      # checked against the digest it took.
      - name: Fetch the macOS release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.macos.outputs.artifact-id || 'none' }}
          path: release
          merge-multiple: true

      - name: Check they're byte for byte what the macOS job made
        shell: pwsh
        env:
          HANDOVER_DIGEST: ${{ needs.macos.outputs.digest }}
        run: |
          python packaging/tree_digest.py release --expect "$env:HANDOVER_DIGEST"
          if ($LASTEXITCODE -ne 0) { throw "The macOS release files aren't what the macOS job made; nothing was published" }

      # As in the Windows job: Git keeps the site's bytes as they are, so the
      # signed feeds reach Pages exactly as signed.
      - name: Keep Git from changing the Pages site's bytes
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout gh-pages branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: gh-pages
          path: gh-pages-checkout

      # After notarization and stapling (the macos job), so the signature
      # covers the DMG's final bytes, as Sparkle downloads them. The key file
      # exists only while the script runs, before any third-party action.
      - name: Sign the DMG and the macOS feeds, and lay them out on the Pages site
        shell: pwsh
        env:
          EDDSA_PRIVATE_KEY: ${{ secrets.EDDSA_PRIVATE_KEY }}
        run: |
          if (-not $env:EDDSA_PRIVATE_KEY) {
              throw "EDDSA_PRIVATE_KEY repo secret is not set."
          }
          # The key Lumi.app is built with (its SUPublicEDKey): every signature must verify with it.
          $source = Get-Content -Raw "lumi/updater.py"
          if ($source -notmatch '(?m)^EDDSA_PUBLIC_KEY = "([^"]+)"') {
              throw "EDDSA_PUBLIC_KEY not found in lumi/updater.py"
          }
          $publicKey = $Matches[1]
          $owner = "${{ github.repository_owner }}".ToLowerInvariant()
          $pages = "https://$owner.github.io/${{ github.event.repository.name }}"
          $keyPath = Join-Path $env:RUNNER_TEMP "eddsa_priv.key"
          try {
              $env:EDDSA_PRIVATE_KEY | Out-File -Encoding ascii -NoNewline $keyPath
              ./packaging/publish_macos.ps1 -Site "gh-pages-checkout" -Release "release" `
                  -Version "${{ needs.macos.outputs.version }}" -PagesUrl $pages `
                  -PrivateKeyFile $keyPath -PublicKey $publicKey `
                  -Notarized:("${{ needs.macos.outputs.notarized }}" -eq "true")
          } finally {
              Remove-Item -Force -ErrorAction SilentlyContinue $keyPath
          }

      # Before anything is published: the site as Git will hold it, macOS
      # feeds and disk images verified from the staged blobs.
      - name: Check the Pages site byte for byte
        shell: pwsh
        run: |
          python packaging/push_pages.py gh-pages-checkout --check `
              --tool packaging/winsparkle/WinSparkle-0.9.2/bin/winsparkle-tool.exe
          if ($LASTEXITCODE -ne 0) { throw "The Pages site doesn't verify; nothing was published" }

      - name: Add the macOS files to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/lumi-${{ needs.macos.outputs.version }}.dmg
            release/lumi-${{ needs.macos.outputs.version }}.pkg
            release/lumi-${{ needs.macos.outputs.version }}-macos-sbom.cdx.json
            release/lumi-${{ needs.macos.outputs.version }}-macos-THIRD_PARTY_NOTICES.txt

      - name: Say on the release that the macOS build isn't notarized
        if: ${{ needs.macos.outputs.notarized != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          append_body: true
          body: |

            **macOS:** this build isn't notarized by Apple yet. The first time you open Lumi, macOS says it can't check it for malicious software; choose Done, then **System Settings › Privacy & Security › Open Anyway**, and confirm. Updates install without asking again. See docs/macos.md.

      # One fresh commit again, on top of what the Windows job published,
      # checked again from the staged blobs; the lease refuses the push if
      # gh-pages moved since the checkout above.
      - name: Push the Pages site
        shell: pwsh
        run: |
          python packaging/push_pages.py gh-pages-checkout `
              --message "release: Lumi ${{ needs.macos.outputs.version }} for macOS, disk image and appcast" `
              --tool packaging/winsparkle/WinSparkle-0.9.2/bin/winsparkle-tool.exe
          if ($LASTEXITCODE -ne 0) { throw "push_pages.py didn't publish the Pages site" }
