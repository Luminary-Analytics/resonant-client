name: Release

# Triggered by pushing a tag like v0.2.0 / v0.2.1 / v1.0.0.
# Tag-only — never on plain commits to main, never on branches.
#
# What this workflow does end-to-end:
#   1. Builds the PyInstaller bundle for the tagged version from the
#      hash-pinned packaging/requirements-release.txt, with third-party
#      notices and a CycloneDX SBOM
#   2. Authenticode-signs lumi.exe, wraps the bundle into an Inno Setup
#      installer (lumi-setup-X.Y.Z.exe) and, for stable tags, an MSI for device
#      management (lumi-X.Y.Z.msi), and Authenticode-signs both when signing
#      credentials are configured (packaging/sign_windows.ps1)
#   3. Signs the installer with the EdDSA private key (from EDDSA_PRIVATE_KEY secret)
#   4. Creates a GitHub Release with the installer, SBOM and notices
#   5. Copies the installer to the GitHub Pages site (downloads/vX.Y.Z/),
#      prunes old installers and adds the release to the update feeds: a
#      stable tag to appcast.xml, the beta feed and its release line's feed;
#      a beta tag (vX.Y.Z-beta.N) to the beta feed only
#   6. Publishes gh-pages as one fresh commit. WinSparkle in installed copies
#      picks up the release within 24h (or on next launch if the check is stale)
#
# macOS, alongside (jobs `macos` and `publish-macos`):
#   7. Builds Lumi.app with Sparkle, the DMG and the PKG (packaging/build_macos.sh)
#      on Apple silicon. With the Apple secrets (docs/macos.md) they are signed
#      with the Developer ID, notarized and stapled; without them the app is
#      signed ad hoc, and the run, the release and the download page say it
#      isn't notarized.
#   8. Once the Windows job has published, signs the DMG with the same EdDSA
#      key, adds the DMG and PKG to the GitHub Release, copies the DMG to the
#      Pages site beside the installer and adds it to the macOS feeds
#      (appcast-macos*.xml; the Windows feeds are left as they are). Sparkle in
#      installed Macs picks it up within 24h.
#   A failed macOS build doesn't hold the Windows release back; rerun its jobs.
#
# Hardening (docs/release-pipeline.md#the-release-environment):
#   - Jobs that use the EdDSA key or the Apple or Windows signing secrets run
#     in the `release` environment, which the owner restricts to v* tags.
#   - Only the two publishing jobs get contents: write; the macOS build reads.
#     Checkouts that never push keep no credentials.
#   - The jobs that write gh-pages share one concurrency group and push with a
#     lease on the commit they checked out, so two runs can't overwrite each
#     other.
#   - The EdDSA key file is deleted as soon as it has signed, before any
#     third-party action runs. Actions are pinned by commit.
#   - With the repository variables MACOS_SIGNING_REQUIRED or
#     WINDOWS_SIGNING_REQUIRED set to true, missing signing secrets fail the
#     release instead of shipping an unsigned build.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write   # creates the Release and pushes gh-pages
    concurrency:
      group: release-gh-pages
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          # GITHUB_REF is refs/tags/v0.2.0 — strip the prefix.
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release $VERSION"

      - name: Sanity check — tag matches __version__
        shell: bash
        run: |
          PKG_VERSION=$(python -c "import re,pathlib;m=re.search(r'__version__\\s*=\\s*\"([^\"]+)\"',pathlib.Path('lumi/__init__.py').read_text());print(m.group(1))")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.version }}) does not match lumi/__init__.py __version__ ($PKG_VERSION)"
            exit 1
          fi
          echo "Version match: $PKG_VERSION"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: 'pip'

      # Correctness gate. A signed installer that auto-updates every deployed
      # copy of Lumi is the last artifact that should ever be cut from a red
      # tree, and a tag push can race ahead of the PR that `tests.yml` gated.
      # ~2 minutes against a 30-minute job budget.
      - name: Install for tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Install the pinned SBOM tools
        run: python -m pip install --require-hashes -r packaging/tools-requirements.txt

      - name: Build PyInstaller bundle
        shell: pwsh
        run: |
          ./scripts/build_clean.ps1 -SbomPath "dist/lumi-${{ steps.version.outputs.version }}-sbom.cdx.json"
          if (-not (Test-Path "dist/lumi/lumi.exe")) {
              throw "PyInstaller did not produce dist/lumi/lumi.exe"
          }
          Copy-Item "dist/lumi/_internal/licenses/THIRD_PARTY_NOTICES.txt" `
              "dist/lumi-${{ steps.version.outputs.version }}-THIRD_PARTY_NOTICES.txt"

      - name: Smoke-test bundled exe
        shell: pwsh
        run: |
          # Just confirm --version works — quick sanity that the bundle is
          # not totally broken before we spend time wrapping it.
          $stdout = Join-Path $env:RUNNER_TEMP "lumi-version.out"
          $stderr = Join-Path $env:RUNNER_TEMP "lumi-version.err"
          $proc = Start-Process -FilePath "dist/lumi/lumi.exe" `
              -ArgumentList "--version" -Wait -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($proc.ExitCode -ne 0) {
              throw "Bundled exe --version exited $($proc.ExitCode): $(Get-Content $stderr -Raw)"
          }
          $output = (Get-Content $stdout -Raw).Trim()
          if ($output -notmatch "lumi ${{ steps.version.outputs.version }}") {
              throw "Bundled exe reported wrong version: $output"
          }
          Write-Host "Smoke test passed: $output"

      # Authenticode is Windows' publisher signature (SmartScreen, company
      # policies); EdDSA below is the update feed's. Unsigned, with a warning,
      # until a certificate is configured: see docs/release-pipeline.md.
      - name: Authenticode-sign lumi.exe
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: ./packaging/sign_windows.ps1 -Files "dist/lumi/lumi.exe"

      # NOTE: windows-latest GitHub-hosted runners ship Inno Setup pre-installed
      # (v6.7+ as of late 2025). No need to install — the "Build installer" step
      # below has a recursive fallback in case the path moves between runner
      # images.

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
              # Fallback for newer choco installs.
              $iscc = (Get-ChildItem "C:\" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue -Depth 5 | Select-Object -First 1).FullName
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "packaging/installer.iss"
          $installer = "dist/installer/lumi-setup-${{ steps.version.outputs.version }}.exe"
          if (-not (Test-Path $installer)) {
              throw "Installer not produced at $installer"
          }
          $size = (Get-Item $installer).Length
          Write-Host "Installer: $installer ($([math]::Round($size / 1MB, 1)) MB)"

      # An MSI for Intune, Configuration Manager and Group Policy. MSI versions
      # are three numbers, so betas get none.
      - name: Build the MSI
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          ./packaging/build_msi.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Authenticode-sign the MSI
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: ./packaging/sign_windows.ps1 -Files "dist/installer/lumi-${{ steps.version.outputs.version }}.msi"

      # Before the EdDSA signature, so the update feed signs the final bytes.
      - name: Authenticode-sign the installer
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: ./packaging/sign_windows.ps1 -Files "dist/installer/lumi-setup-${{ steps.version.outputs.version }}.exe"

      - name: Sign installer with EdDSA
        id: sign
        shell: pwsh
        env:
          EDDSA_PRIVATE_KEY: ${{ secrets.EDDSA_PRIVATE_KEY }}
        run: |
          if (-not $env:EDDSA_PRIVATE_KEY) {
              throw "EDDSA_PRIVATE_KEY repo secret is not set. Generate with `winsparkle-tool generate-key` and add to repo secrets."
          }
          # The private key goes to a file only for as long as signing takes:
          # later steps run third-party actions with write access, so it is
          # deleted here, whatever happens.
          $keyPath = "$env:RUNNER_TEMP\eddsa_priv.key"
          $tool = "packaging/winsparkle/WinSparkle-0.9.2/bin/winsparkle-tool.exe"
          $installer = "dist/installer/lumi-setup-${{ steps.version.outputs.version }}.exe"
          try {
              $env:EDDSA_PRIVATE_KEY | Out-File -Encoding ascii -NoNewline $keyPath
              # winsparkle-tool sign prints just the base64 EdDSA signature to
              # stdout. The installer is the trailing positional arg, NOT --file.
              $signature = & $tool sign --private-key-file $keyPath $installer
              if ($LASTEXITCODE -ne 0) {
                  throw "winsparkle-tool sign failed with exit code $LASTEXITCODE"
              }
          } finally {
              Remove-Item -Force -ErrorAction SilentlyContinue $keyPath
          }
          $signature = "$signature".Trim()
          Write-Host "EdDSA signature: $($signature.Substring(0, [Math]::Min(20, $signature.Length)))..."
          echo "signature=$signature" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release with installer
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lumi ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            dist/installer/lumi-setup-${{ steps.version.outputs.version }}.exe
            dist/installer/lumi-${{ steps.version.outputs.version }}.msi
            dist/lumi-${{ steps.version.outputs.version }}-sbom.cdx.json
            dist/lumi-${{ steps.version.outputs.version }}-THIRD_PARTY_NOTICES.txt

      # Installed apps poll the GitHub Pages feeds and download installers
      # anonymously. The source repository may be private, so Release assets
      # are not reachable for them; the Pages site hosts the newest installers
      # too. Pre-release tags reach only the beta feed (appcast-beta.xml), so
      # installs on the stable channel never see them.
      - name: Checkout gh-pages branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: gh-pages
          path: gh-pages-checkout

      - name: Publish installer and appcast to the Pages site
        shell: pwsh
        run: |
          $owner = "${{ github.repository_owner }}".ToLowerInvariant()
          $repo = "${{ github.event.repository.name }}"
          $pages = "https://$owner.github.io/$repo"
          $installer = "dist/installer/lumi-setup-${{ steps.version.outputs.version }}.exe"
          $extras = @()
          $msi = "dist/installer/lumi-${{ steps.version.outputs.version }}.msi"
          if (Test-Path $msi) { $extras = @("--extra", $msi) }
          python packaging/publish_pages.py `
              --site "gh-pages-checkout" `
              --installer $installer `
              --version "${{ steps.version.outputs.version }}" @extras
          if ($LASTEXITCODE -ne 0) { throw "publish_pages.py failed" }

          $notes = "<p>Lumi ${{ steps.version.outputs.version }}. See <a href=`"$pages/`">$pages/</a>.</p>"
          python packaging/update_appcast.py `
              --version "${{ steps.version.outputs.version }}" `
              --installer $installer `
              --signature "${{ steps.sign.outputs.signature }}" `
              --notes $notes `
              --site "gh-pages-checkout" `
              --download-base "$pages/downloads"
          if ($LASTEXITCODE -ne 0) { throw "update_appcast.py failed" }

      # Publish gh-pages as one fresh commit so removed installers do not
      # accumulate in branch history. appcast.xml keeps the version history.
      # The lease refuses the push if gh-pages moved since the checkout above.
      - name: Push the Pages site
        shell: bash
        working-directory: gh-pages-checkout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          git add -A
          git diff --cached --quiet && exit 0  # nothing changed, e.g. retry of an existing release
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "release: Lumi ${{ steps.version.outputs.version }} installer and appcast")
          git push --force-with-lease="gh-pages:$base" origin "$commit:refs/heads/gh-pages"

  macos:
    # Lumi.app in a DMG (Sparkle updates it from the macOS feeds) and a PKG for
    # device management, built on Apple silicon by packaging/build_macos.sh.
    # It only builds: read access, and the release environment for the Apple
    # secrets.
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      notarized: ${{ steps.status.outputs.notarized }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building the macOS release $VERSION"

      - name: Sanity check — tag matches __version__
        shell: bash
        run: |
          PKG_VERSION=$(python3 -c "import re,pathlib;m=re.search(r'__version__\\s*=\\s*\"([^\"]+)\"',pathlib.Path('lumi/__init__.py').read_text());print(m.group(1))")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.version }}) does not match lumi/__init__.py __version__ ($PKG_VERSION)"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install the pinned SBOM tools
        run: python3 -m pip install --require-hashes -r packaging/tools-requirements.txt

      # Signed with the Developer ID, notarized and stapled when these secrets
      # exist (RELEASING.md, docs/macos.md); otherwise signed ad hoc, unless
      # the MACOS_SIGNING_REQUIRED variable is true, which fails the build.
      - name: Build Lumi.app, the DMG and the PKG
        env:
          MACOS_SIGNING_REQUIRED: ${{ vars.MACOS_SIGNING_REQUIRED }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_SIGN_P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/build_macos.sh --sbom "dist/lumi-${{ steps.version.outputs.version }}-macos-sbom.cdx.json"

      - name: Smoke-test the app
        env:
          LUMI_KEYCHAIN: 'off'
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          app="dist/Lumi.app/Contents/MacOS/lumi"
          "$app" --version | tee version.txt
          grep -qx "lumi ${{ steps.version.outputs.version }}" version.txt
          "$app" --print-pubkey | tee pubkey.txt
          test "EDDSA_PUBLIC_KEY=$(plutil -extract SUPublicEDKey raw dist/Lumi.app/Contents/Info.plist)" = "$(sed -n 1p pubkey.txt)"
          test "$(plutil -extract SURequireSignedFeed raw dist/Lumi.app/Contents/Info.plist)" = "true"
          test -x dist/Lumi.app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate
          "$app" updates | tee updates.json
          python3 -c 'import json; s = json.load(open("updates.json")); assert s["platform"] == "macos" and s["installed_by"] == "", s'

      - name: Record whether the DMG is notarized
        id: status
        run: |
          dmg="dist/installer/lumi-${{ steps.version.outputs.version }}.dmg"
          if xcrun stapler validate "$dmg" >/dev/null 2>&1; then
            echo "notarized=true" >> "$GITHUB_OUTPUT"
            echo "The DMG is signed with the Developer ID, notarized and stapled."
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=macOS build not notarized::Lumi.app is signed ad hoc, not with a Developer ID, and the DMG isn't notarized. macOS won't open it until each tester chooses Open Anyway in System Settings > Privacy & Security. Add the Apple secrets in RELEASING.md to sign and notarize."
          fi

      - name: Gather the release files
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          mkdir -p release
          cp "dist/installer/lumi-$v.dmg" "dist/installer/lumi-$v.pkg" "dist/lumi-$v-macos-sbom.cdx.json" release/
          cp "$(find dist/Lumi.app -name THIRD_PARTY_NOTICES.txt | head -1)" "release/lumi-$v-macos-THIRD_PARTY_NOTICES.txt"
          ls -l release

      - name: Keep them for the publishing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lumi-macos-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish-macos:
    # After the Windows job, which creates the GitHub Release and pushes
    # gh-pages; this adds to both. On Windows, so winsparkle-tool signs the
    # DMG and the macOS feeds exactly as it signs the installer, with the same
    # key (packaging/publish_macos.ps1, which build-macos.yml rehearses with a
    # throwaway key on every packaging change).
    needs: [release, macos]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write   # adds to the Release and pushes gh-pages
    concurrency:
      group: release-gh-pages
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Fetch the macOS release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lumi-macos-release
          path: release

      - name: Checkout gh-pages branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: gh-pages
          path: gh-pages-checkout

      # After notarization and stapling (the macos job), so the signature
      # covers the DMG's final bytes, as Sparkle downloads them. The key file
      # exists only while the script runs, before any third-party action.
      - name: Sign the DMG and the macOS feeds, and lay them out on the Pages site
        shell: pwsh
        env:
          EDDSA_PRIVATE_KEY: ${{ secrets.EDDSA_PRIVATE_KEY }}
        run: |
          if (-not $env:EDDSA_PRIVATE_KEY) {
              throw "EDDSA_PRIVATE_KEY repo secret is not set."
          }
          # The key Lumi.app is built with (its SUPublicEDKey): every signature must verify with it.
          $source = Get-Content -Raw "lumi/updater.py"
          if ($source -notmatch '(?m)^EDDSA_PUBLIC_KEY = "([^"]+)"') {
              throw "EDDSA_PUBLIC_KEY not found in lumi/updater.py"
          }
          $publicKey = $Matches[1]
          $owner = "${{ github.repository_owner }}".ToLowerInvariant()
          $pages = "https://$owner.github.io/${{ github.event.repository.name }}"
          $keyPath = Join-Path $env:RUNNER_TEMP "eddsa_priv.key"
          try {
              $env:EDDSA_PRIVATE_KEY | Out-File -Encoding ascii -NoNewline $keyPath
              ./packaging/publish_macos.ps1 -Site "gh-pages-checkout" -Release "release" `
                  -Version "${{ needs.macos.outputs.version }}" -PagesUrl $pages `
                  -PrivateKeyFile $keyPath -PublicKey $publicKey `
                  -Notarized:("${{ needs.macos.outputs.notarized }}" -eq "true")
          } finally {
              Remove-Item -Force -ErrorAction SilentlyContinue $keyPath
          }

      - name: Add the macOS files to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/lumi-${{ needs.macos.outputs.version }}.dmg
            release/lumi-${{ needs.macos.outputs.version }}.pkg
            release/lumi-${{ needs.macos.outputs.version }}-macos-sbom.cdx.json
            release/lumi-${{ needs.macos.outputs.version }}-macos-THIRD_PARTY_NOTICES.txt

      - name: Say on the release that the macOS build isn't notarized
        if: ${{ needs.macos.outputs.notarized != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          append_body: true
          body: |

            **macOS:** this build isn't notarized by Apple yet. The first time you open Lumi, macOS says it can't check it for malicious software; choose Done, then **System Settings › Privacy & Security › Open Anyway**, and confirm. Updates install without asking again. See docs/macos.md.

      # One fresh commit again, on top of what the Windows job published. The
      # lease refuses the push if gh-pages moved since the checkout above.
      - name: Push the Pages site
        shell: bash
        working-directory: gh-pages-checkout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          git add -A
          git diff --cached --quiet && exit 0  # nothing changed, e.g. retry of an existing release
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "release: Lumi ${{ needs.macos.outputs.version }} for macOS, disk image and appcast")
          git push --force-with-lease="gh-pages:$base" origin "$commit:refs/heads/gh-pages"
