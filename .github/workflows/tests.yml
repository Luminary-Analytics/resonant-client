name: Tests

# The correctness gate for the repo.
#
# Why this exists:
#   Until v0.11.6 the only CI on this project was `build-check.yml`, which
#   builds the PyInstaller bundle and asks the frozen exe to print its version.
#   That catches packaging bugs (see bug #12) and nothing else. The 2,700+ test
#   suite ran only when a developer remembered to run it, and `release.yml`
#   would happily cut a signed installer from a red tree.
#
#   The suite takes ~2 minutes. There is no good reason not to gate on it.
#
# Note the deliberately broad path filter compared to build-check.yml: that
# workflow ignores `tests/**`, so a test-only change used to trigger no CI at
# all. Correctness CI must run when the tests themselves change.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # windows-latest matches the platform Lumi mostly ships on, and the
    # platform-sensitive parts of the harness (subprocess-tree cancellation,
    # path validation, the grep/glob tools) behave differently elsewhere.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install
        # Deliberately NOT installing the `code-intelligence` extra. Nothing in
        # tests/ imports tree_sitter, so the extra buys no coverage — it would
        # only change which import branch `code_intelligence.py` takes, on a
        # path this suite has never exercised. Matching the environment the
        # suite is actually verified against keeps a red gate meaningful.
        # Covering tree-sitter properly is a test-writing job, not a CI flag.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Lint
        # `lumi/**` is held to ruff's full default rule set. Test and
        # support code carries narrow per-file exemptions declared in
        # pyproject.toml rather than being excluded outright.
        run: python -m ruff check .

      - name: Test
        # -q overrides the `-v` in pyproject addopts (CLI args win) to keep the
        # CI log readable; failures still print with --tb=short.
        # The Team preview's suite (tests/test_swarm_*.py) runs in team-tests.yml:
        # it starts real processes and git worktrees and takes ~15 minutes.
        run: python -m pytest -q --ignore-glob="tests/test_swarm_*.py"

      - name: Set up Node for frontend regression checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test draft recovery and appearance
        run: node --test tests/ui_recovery.test.cjs tests/appearance.test.cjs tests/autonomous_view.test.cjs tests/vscode_extension.test.cjs tests/voice_input.test.cjs tests/extension_panels.test.cjs

  pytest-macos:
    # The updater's macOS paths on the platform they're for (lumi/sparkle.py,
    # tests/test_sparkle.py): PyObjC's view of the delegate and, with the
    # pinned framework packaging/fetch_sparkle.sh fetches, Sparkle itself
    # reading a feed update_appcast.py wrote. Plus the feed, Pages and PKG
    # tests they build on. The full suite stays on Windows (above).
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Fetch the pinned Sparkle
        run: bash packaging/fetch_sparkle.sh "$RUNNER_TEMP/sparkle"

      - name: Test the updater on macOS
        env:
          LUMI_KEYCHAIN: 'off'
          LUMI_TEST_SPARKLE_FRAMEWORK: ${{ runner.temp }}/sparkle/Sparkle.framework
        run: |
          set -o pipefail
          export HOME="$(mktemp -d)"
          unset LUMI_STATE_HOME
          python -m pytest -q -rs tests/test_sparkle.py 2>&1 | tee pytest-sparkle.log
          # None of these may be skipped here: they are the evidence for PyObjC and Sparkle.
          if grep -q "SKIPPED" pytest-sparkle.log; then echo "Sparkle tests were skipped on macOS"; exit 1; fi
          python -m pytest -q -rs tests/test_updates.py tests/test_update_feeds.py tests/test_publish_pages.py \
            tests/test_macos_pkg.py
