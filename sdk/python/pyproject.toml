[project]
name = "lumi-extension"
version = "1.0.0"
description = "Write Lumi extensions in Python: model providers and a test kit (Extension SDK v1)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lumi_extension"]

# The SDK is MIT-licensed, unlike Lumi itself. Its license file sits inside
# the package, so it travels with every copy: installed, or copied into a
# pack by sdk/new_pack.py.
[tool.setuptools.package-data]
lumi_extension = ["LICENSE"]
