[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resonant-client"
version = "0.6.14"
description = "Ollama-native agentic coding desktop app — purpose-built for GLM, DeepSeek, and other open-source local models"
readme = "README.md"
# v0.6.2 — relicensed Proprietary → MIT. Resonant Client is now an
# open-source flagship for local-first self-improving autonomous
# coding. See LICENSE at the repo root.
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Luminary Analytics"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "rich>=13.9.0",
    "prompt-toolkit>=3.0.0",
    "httpx>=0.27.0",
]

# v0.4.0 — Anthropic / OpenAI / Claude Code / Codex / Resonant Engine /
# MLX / LM Studio backends were cut. Resonant Client is now an
# Ollama-only client. If you want Anthropic models, use Claude Code;
# for OpenAI, use Codex. The previous `[claude]` and `[openai]` extras
# groups were removed along with their backend modules.
[project.optional-dependencies]
server = ["websockets>=12.0"]
browser = ["playwright>=1.40.0"]
desktop = ["pyautogui>=0.9.54", "mss>=9.0.0", "Pillow>=10.0.0"]
gui = [
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "pywebview>=5.0",
    # WebSocket server is core to the GUI's agent-loop streaming. Was
    # previously only in the `[server]` extras group, which meant CI
    # builds installed `[gui,desktop,...]` but NOT websockets, so the
    # bundled exe couldn't upgrade WebSocket connections — every page
    # reload sat on "Reconnecting..." forever. Bug #24, fixed v0.2.7.
    "websockets>=12.0",
]
all = [
    "websockets>=12.0",
    "playwright>=1.40.0",
    "pyautogui>=0.9.54",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "pywebview>=5.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Fast isolated unit tests",
    "integration: Tests that touch filesystem or network",
    "adversarial: Stress tests and edge cases",
    "slow: Tests that take >1 second",
]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-x",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["resonant_client"]
omit = [
    "resonant_client/gui/*",
    "resonant_client/tui.py",
    "resonant_client/__main__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "logger\\.",
    "except Exception",
]

[project.scripts]
resonant = "resonant_client.__main__:main"
resonant-tui = "resonant_client.__main__:main"
resonant-gui = "resonant_client.gui.server:main"
resonant-smoke = "resonant_client.smoke.cli:main"
resonant-skill = "resonant_client.orchestration.skill_cli:main"

[tool.setuptools.packages.find]
include = ["resonant_client*"]

[tool.setuptools.package-data]
# v0.6.0a1 — bundled skills ship inside the package so importlib.resources
# can find them in pip / wheel / pyinstaller installs, not just source
# checkouts.
"resonant_client.orchestration.bundled_skills" = ["*.md"]
