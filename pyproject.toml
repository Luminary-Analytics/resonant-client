[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resonant-client"
version = "0.13.0"
description = "Provider-adaptive multimodal coding agent for local and hosted models"
readme = "README.md"
# v0.6.2 — relicensed Proprietary → MIT. Resonant Client is now an
# open-source harness for local-first self-improving autonomous
# coding. See LICENSE at the repo root.
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Luminary Analytics"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "rich>=13.9.0",
    "prompt-toolkit>=3.0.0",
    "httpx>=0.27.0",
]

# Kimi uses the existing httpx dependency directly; no provider SDK is needed.
[project.optional-dependencies]
server = ["websockets>=12.0"]
desktop = [
    "pyautogui>=0.9.54",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    # Backs the `process_list` and `process_kill` agent tools. This was
    # undeclared until v0.11.7 and only ever worked on machines where an
    # unrelated package happened to pull psutil in. build_clean.ps1 installs
    # [gui,desktop], so every shipped .exe answered both tools with
    # "psutil not installed" — two advertised tools dead in every release.
    "psutil>=5.9.0",
]
gui = [
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "pywebview>=5.0",
    # WebSocket server is core to the GUI's agent-loop streaming. Was
    # previously only in the `[server]` extras group, which meant CI
    # builds installed `[gui,desktop,...]` but NOT websockets, so the
    # bundled exe couldn't upgrade WebSocket connections — every page
    # reload sat on "Reconnecting..." forever. Bug #24, fixed v0.2.7.
    "websockets>=12.0",
]
all = [
    "websockets>=12.0",
    "pyautogui>=0.9.54",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "pywebview>=5.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    # Upper bound is deliberate. A linter is a gate, not a dependency: an
    # unpinned `>=` lets a new ruff minor turn `main` red without a code
    # change. Raise this bound intentionally, then fix whatever the new
    # version reports. See [tool.ruff.lint] for the rule-set contract.
    "ruff>=0.15.0,<0.17.0",
]
code-intelligence = [
    "tree-sitter-language-pack>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Fast isolated unit tests",
    "integration: Tests that touch filesystem or network",
    "adversarial: Stress tests and edge cases",
    "slow: Tests that take >1 second",
]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
# NOTE: `-x` (exit on first failure) deliberately NOT in addopts. It hides the
# blast radius of a regression — one failure is reported where twenty may
# exist, which is exactly the wrong signal on a CI gate or a refactor. Pass
# `-x` explicitly when bisecting locally.
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Declared explicitly, NOT inherited. Ruff's *default* select changes between
# releases: this gate was authored against 0.15.10 and went red on its first CI
# run purely because pip resolved `ruff>=0.3.0` to 0.16.0, whose wider defaults
# reported 1,249 findings across a tree nobody had touched. A lint gate whose
# rule set drifts with the installed version fails on the release, not on the
# change that caused it.
#
# These four are ruff's historical defaults (pyflakes + the pycodestyle errors
# worth enforcing). Widening the set is a deliberate, separate piece of work —
# edit this list, fix the fallout, and pin the new contract here.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# `resonant_client/**` is held to the full default rule set and is clean — the
# CI gate depends on that staying true. Test/support code gets a narrow set of
# stylistic exemptions so the gate still catches real problems (undefined
# names, unused imports, redefinitions) everywhere.
#
#   E402 — tests import after sys.path/monkeypatch setup by design
#   E702 — compact one-line fixture setup in smoke scripts
#   E731 — lambda stubs are the point in backend-substitution tests
#   E741 — `l` as a line variable in diff-parsing assertions
#   F841 — fixture return values captured for readability, not used
"tests/**" = ["E402", "E702", "E731", "E741", "F841"]
"scripts/**" = ["E702"]
"packaging/**" = ["F841"]

[tool.coverage.run]
source = ["resonant_client"]
omit = [
    "resonant_client/gui/*",
    "resonant_client/tui.py",
    "resonant_client/__main__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "logger\\.",
    "except Exception",
]

[project.scripts]
resonant = "resonant_client.__main__:main"
resonant-tui = "resonant_client.__main__:main"
resonant-gui = "resonant_client.gui.server:main"
resonant-smoke = "resonant_client.smoke.cli:main"
resonant-skill = "resonant_client.orchestration.skill_cli:main"

[tool.setuptools.packages.find]
include = ["resonant_client*"]

[tool.setuptools.package-data]
# v0.6.0a1 — bundled skills ship inside the package so importlib.resources
# can find them in pip / wheel / pyinstaller installs, not just source
# checkouts.
"resonant_client.orchestration.bundled_skills" = ["*.md"]
# The unpacked Chrome extension behind the browser tools' tab grouping. Listed
# here as well as in packaging/resonant.spec: the spec only covers the frozen
# .exe, and without this a `pip install` silently omits the extension and tabs
# stop being grouped with no error anywhere.
"resonant_client" = ["browser_extension/*"]
