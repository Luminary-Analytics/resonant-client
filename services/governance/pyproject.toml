[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonn-governance"
version = "0.1.0.dev0"
description = "Independent SONN governance service source foundation"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]==3.2.10",
    "PyJWT==2.10.1",
    "cryptography==46.0.0",
    "httpx==0.28.1",
    "h11==0.16.0",
    "starlette==0.52.1",
    "uvicorn==0.41.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "ruff==0.15.7"]

[project.scripts]
sonn-governance = "sonn_governance.__main__:main"
sonn-governance-host = "sonn_governance.host_main:main"
sonn-governance-scim = "sonn_governance.scim_main:main"
sonn-governance-archive = "sonn_governance.archive_main:main"
sonn-governance-admin = "sonn_governance.admin_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonn_governance = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
